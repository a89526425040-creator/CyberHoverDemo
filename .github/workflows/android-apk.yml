name: Build Cyber Hover APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify original vehicle files
        run: |
          test -f assets/source/cdp-test-7.blend
          test -d assets/textures
          test -f assets/textures/cdp_body_normal.png

      - name: Install Blender and Java
        run: |
          sudo apt-get update
          sudo apt-get install -y blender openjdk-17-jdk unzip wget

      - name: Export Blender model to GLB
        run: blender -b --python scripts/export_blend.py

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.4.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Configure Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF

      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/CyberHoverDemo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberHoverDemo-APK
          path: build/CyberHoverDemo.apk
          if-no-files-found: error
