name: Build Cyber Hover APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded vehicle archive
        run: |
          if [ ! -f assets/source/free-cyberpunk-hovercar.zip ]; then
            echo "::error::Original hovercar archive is missing. Refusing to build a placeholder vehicle."
            exit 1
          fi
          mkdir -p assets/source
          unzip -o assets/source/free-cyberpunk-hovercar.zip -d assets/

      - name: Check optional source model
        id: model
        run: |
          if [ -f assets/source/cdp-test-7.blend ] && [ -f assets/textures/cdp_body_normal.png ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Original Blender model or required texture is missing."
            exit 1
          fi

      - name: Install Blender (when model is present)
        if: steps.model.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Convert Blender model to GLB
        if: steps.model.outputs.available == 'true'
        run: blender -b --python scripts/export_blend.py

      - name: Remove Blender source before Godot import
        run: |
          test -s assets/hovercar.glb
          rm -f assets/source/cdp-test-7.blend
          echo "Godot will import the optimized GLB, not the original Blender project."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Download Godot and export templates
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cyberhover-android-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p ~/.config/godot ~/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cyber Hover Demo,O=Cyber Hover,C=US"
          fi
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Set Android version code
        run: |
          sed -i -E "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          grep '^version/code=' export_presets.cfg

      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import

      - name: Export Android APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/CyberHoverDemo.apk

      - name: Verify APK signature and alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/CyberHoverDemo.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 build/CyberHoverDemo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CyberHoverDemo-APK
          path: build/CyberHoverDemo.apk
          if-no-files-found: error
