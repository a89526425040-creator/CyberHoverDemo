name: Build Cyber Hover APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded vehicle archive
        run: |
          if [ -f assets/source/free-cyberpunk-hovercar.zip ]; then
            unzip -o assets/source/free-cyberpunk-hovercar.zip -d assets/
          fi

      - name: Check optional source model
        id: model
        run: |
          if [ -f assets/source/cdp-test-7.blend ] && [ -f assets/textures/cdp_body_normal.png ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Original Blender model/textures are not uploaded yet. Building the physics demo with a temporary placeholder vehicle."
          fi

      - name: Install Blender (when model is present)
        if: steps.model.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Convert Blender model to GLB
        if: steps.model.outputs.available == 'true'
        run: blender -b --python scripts/export_blend.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot and export templates
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Configure Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import

      - name: Export Android APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/CyberHoverDemo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CyberHoverDemo-APK
          path: build/CyberHoverDemo.apk
          if-no-files-found: error
